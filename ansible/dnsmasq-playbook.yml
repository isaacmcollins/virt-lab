---
- name: Install and configure Dnsmasq
  hosts: manager
  become: true
  vars_files:
    - dnsmasq-vars.yml

  tasks:
    - name: Install Dnsmasq package
      ansible.builtin.package:
        name: dnsmasq
        state: present

    - name: Deploy static DNS records mapping file
      ansible.builtin.template:
        src: templates/dnsmasq.hosts.j2
        dest: /etc/dnsmasq.hosts
        owner: root
        group: root
        mode: '0644'
      notify: Restart Dnsmasq

    - name: Deploy Dnsmasq configuration template
      ansible.builtin.template:
        src: templates/dnsmasq.conf.j2
        dest: /etc/dnsmasq.conf
        owner: root
        group: root
        mode: '0644'
      notify: Restart Dnsmasq

    - name: Ensure Dnsmasq service is enabled and started
      ansible.builtin.service:
        name: dnsmasq
        enabled: true
        state: started

  handlers:
    - name: Restart Dnsmasq
      ansible.builtin.service:
        name: dnsmasq
        state: restarted
