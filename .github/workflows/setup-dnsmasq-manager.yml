name: Setup dnsmasq on manager

on:
  workflow_dispatch:

jobs:
  dnsmasq:
    runs-on: [self-hosted, linux, manager]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
            version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Ensure Ansible is available
        shell: bash
        run: |
          if ! uv tool list | grep -q "^ansible "; then
                uv tool install --with-executables-from ansible-core ansible
            else
                ansible-playbook --version
            fi

      - name: Run Ansible playbook on this runner
        shell: bash
        run: |
          cd ./ansible
          ansible-playbook \
            -i inventory.ini \
            dnsmasq-playbook.yml

      - name: Confirm dnsmasq is running
        shell: bash
        run: |
          systemctl is-active --quiet dnsmasq || service dnsmasq status
