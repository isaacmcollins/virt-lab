name: Setup dnsmasq on manager

on:
  workflow_dispatch:

jobs:
  dnsmasq:
    runs-on: [self-hosted, linux, manager]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
            enable-cache: true
            cache-dependency-glob: ""
            version: "latest"

      - name: Run Ansible playbook on this runner
        shell: bash
        run: |
          cd ./ansible
          uv run --with ansible-core \
            ansible-playbook \
            -i inventory.ini \
            dnsmasq-playbook.yml

      - name: Confirm dnsmasq is running
        shell: bash
        run: |
          systemctl is-active --quiet dnsmasq || service dnsmasq status
